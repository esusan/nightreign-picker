<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナイトレイン キャラランダムツール（OBS対応）</title>
<meta name="description" content="ナイトレインで次に出撃するキャラをランダムに抽選するツール。OBSのブラウザソースとしても使えます / Randomly picks the Nightfarer for your next expedition in NIGHTREIGN. Also works as an OBS browser source.">
<meta property="og:type" content="website">
<!-- リンクカード用。XなどはJSを実行しないので日英併記にしておく -->
<meta property="og:title" content="ナイトレイン キャラランダムツール / NIGHTREIGN Random Nightfarer Picker">
<meta property="og:description" content="次に出撃するキャラをランダムに抽選するツール。OBS対応 / Randomly picks the Nightfarer for your next expedition. Works as an OBS browser source.">
<meta property="og:url" content="https://esusan.github.io/nightreign-picker/">
<meta property="og:image" content="https://esusan.github.io/nightreign-picker/img/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://esusan.github.io/nightreign-picker/img/ogp.png">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&family=Noto+Serif+JP:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#b9c6ec;
  --gold-soft:rgba(185,198,236,.55);
  --card-bg:#15131c;
  --card-line:rgba(255,255,255,.14);
  --text:#f3eee2;
  --muted:#a59f92;
  --panel:#1b1922;
  --panel-2:#24212d;
  --line:#3a3644;
  --accent:#d9a93a;
  --danger:#d0574b;
  --font:"LINE Seed JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; /* 編集画面。遺物ページと同じ */
  --font-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; /* 抽選画面。ゲームに合わせて明朝 */
}
/* 英語版の抽選画面は英字用のセリフ体を先に当てる（明朝の英字は細くて地味なため）。
   langはブラウザの翻訳で書き換わるので、専用のdata-langで判定する */
html[data-lang="en"]{--font-display:"Cormorant Garamond","Noto Serif JP",serif}
/* Cormorantは字が小さく細いので、太さを上げ、x-heightを揃えて約1.15倍に見せる（0.386→0.44） */
html[data-lang="en"] body.display,html[data-lang="en"] .pp-card{font-weight:600;font-size-adjust:.44}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--text);
  font-family:var(--font)}
body.display{overflow:hidden;font-family:var(--font-display);font-weight:500}
.pp-card{font-family:var(--font-display);font-weight:500}
body.instant *{transition:none !important}
/* OBS以外（編集画面のプレビューやブラウザで直接開いたとき）だけ、配信画面に見立てた背景画像を敷く */
body.display.preview{background:#0d0b11 url("img/preview-bg.jpg") center/cover no-repeat}
body.edit{background:#0f0e14;font-size:14px}

/* ---------- 表示 ---------- */
/* 1920×1080で固定レイアウトし、ウィンドウに合わせて拡大縮小する */
#canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;user-select:none;transform:translate(-50%,-50%) scale(var(--k,1))}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;user-select:none}
/* 最終行が埋まらないときも中央に寄せるため、gridではなく幅固定のflex折り返しで並べる */
#grid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap,12px);
  width:calc(var(--cols,5) * var(--cw,160px) + (var(--cols,5) - 1) * var(--gap,12px))}
#grid .cell{flex:none}
#grid.toggleable .cell{cursor:pointer}
/* ゲームのキャラ選択画面風：細い二重線＋四隅の角飾り（控えめ）。画像は下寄せで上側を暗くし、そこに見出しを置く */
.cell{--u:calc(var(--cw,160px) / 180);position:relative;width:var(--cw,160px);aspect-ratio:3/4;
  background:linear-gradient(180deg,#141826,#0a0b12);border:1px solid rgba(185,198,236,.28);overflow:hidden;box-shadow:0 6px 17px rgba(0,0,0,.6);
  transition:opacity .4s,filter .4s,transform .25s}
.cell::before{content:"";position:absolute;inset:calc(var(--u)*5);border:1px solid rgba(185,198,236,.12);pointer-events:none;z-index:2}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.35;--k:calc(var(--u)*10);background:
  linear-gradient(var(--gold),var(--gold)) 0 0/var(--k) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 0/1px var(--k) no-repeat,
  linear-gradient(var(--gold),var(--gold)) 100% 0/var(--k) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 0/1px var(--k) no-repeat,
  linear-gradient(var(--gold),var(--gold)) 0 100%/var(--k) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/1px var(--k) no-repeat,
  linear-gradient(var(--gold),var(--gold)) 100% 100%/var(--k) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 100%/1px var(--k) no-repeat}
.cell .art{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.cell .art img{display:block;width:100%;height:auto;-webkit-mask:linear-gradient(180deg,transparent,#000 22%);mask:linear-gradient(180deg,transparent,#000 22%)}
.cell .art .initial{margin:auto;font-size:calc(var(--cw,160px)*.42);color:rgba(255,255,255,.85);text-shadow:0 0 11px rgba(0,0,0,.8)}
/* 見出し：キャラ名の上に、二つ名のようにコンセプトを小さく添える（無くても行の高さは確保して、キャラ名の位置を揃える） */
.cell .label{position:absolute;left:0;right:0;top:calc(var(--u)*7);z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 4%;
  text-align:center;line-height:1.2;text-shadow:0 0 6px #000,0 0 3px #000}
.cell .ttl{font-size:calc(var(--u)*19);color:#eef1fb;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* キャラ名の下の線。文字幅ではなくカード幅基準にする（.ttlはoverflow:hiddenなので.label側に付ける） */
.cell .label::after{content:"";display:block;width:75%;height:1px;margin-top:calc(var(--u)*7);background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.cell .sub{margin-bottom:0;font-size:calc(var(--u)*17);color:var(--gold);letter-spacing:-.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell.on{border-color:var(--gold);transform:scale(1.07);box-shadow:0 0 0 2px var(--gold),0 0 27px var(--gold),0 0 54px var(--gold-soft);z-index:2}
.cell.out{opacity:.65;filter:grayscale(1) brightness(.75)}
#stage.done .cell{opacity:0}
#stage.done .cell.win{opacity:0}
/* 結果画面・ミニカード・非表示のときは、見えなくなった一覧のカードがタップに反応しないようにする */
#stage.done .cell,#canvas.pinned .cell,#canvas.hidden .cell{pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 22px var(--gold),0 0 43px var(--gold-soft)}50%{box-shadow:0 0 0 3px var(--gold),0 0 43px var(--gold),0 0 97px var(--gold-soft)}}
/* 結果画面の大きさ（オプションでは変えない固定値） */
#result{--rs:.9;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(calc(.85 * var(--rs,1)));opacity:0;pointer-events:none;transition:opacity .5s,transform .5s cubic-bezier(.2,1.4,.4,1);
  display:flex;flex-direction:column;align-items:center;gap:56px}
#result.show{opacity:1;transform:translate(-50%,-50%) scale(var(--rs,1))}
#result .cell{transform:none;animation:pulse 1.4s ease-in-out infinite;border-color:var(--gold)}
/* 結果画面は下に名前が出るので、カード上の見出しは出さない */
#result .cell .label{display:none}
/* 抽選ボタン（一覧側はカード一覧の大きさに合わせて縮める。結果側は等倍） */
.draw-btn{--b:var(--bs,1);flex:none;margin-top:calc(52px * var(--b));padding:calc(20px * var(--b)) calc(96px * var(--b));font:inherit;font-size:calc(44px * var(--b));
  letter-spacing:.2em;text-indent:.2em;color:#eef1fb;background:rgba(14,16,26,.85);border:1px solid var(--gold);cursor:pointer;
  box-shadow:0 0 calc(18px * var(--b)) var(--gold-soft);transition:opacity .3s,background .2s,box-shadow .2s}
.draw-btn:hover{background:rgba(40,46,70,.9);box-shadow:0 0 calc(30px * var(--b)) var(--gold-soft)}
#result .draw-btn{--b:1;margin-top:0;pointer-events:none}
#result.show .draw-btn{pointer-events:auto}
/* 結果画面の「もう一度出撃」の下に「一覧に戻る」をテキストリンクで出す */
#result .r-btns{display:flex;flex-direction:column;align-items:center;gap:36px}
.back-link{font:inherit;font-size:26px;letter-spacing:.15em;color:var(--muted);background:none;border:0;padding:4px 8px;cursor:pointer;
  text-shadow:0 0 6px #000;pointer-events:none;transition:color .2s}
.back-link:hover{color:var(--gold)}
#result.show .back-link{pointer-events:auto}
#canvas.pinned .back-link,#canvas.hidden .back-link{pointer-events:none}
#stage.running .draw-btn,#stage.done .draw-btn{opacity:0;pointer-events:none}
#canvas.pinned .draw-btn{pointer-events:none}
#result .r-concept{margin-right:.3em}
#result .cell{aspect-ratio:1/1}
#result .cell .art img{-webkit-mask:none;mask:none}
#result .r-text{padding:13px 76px;text-align:center;white-space:nowrap;
  background:linear-gradient(90deg,transparent,rgba(8,7,12,.92) 15%,rgba(8,7,12,.92) 85%,transparent);border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft)}
#result .r-label{font-size:26px;letter-spacing:.15em;color:var(--muted)}
#result .r-name{font-size:76px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 22px rgba(185,198,236,.6)}
#empty{font-size:32px;color:var(--muted);text-shadow:0 0 6px #000}
/* 決定後の指定位置表示：結果画面ごとフェードアウトして、当選カードだけを指定位置にフェードイン */
#stage{transition:opacity .6s}
/* 重なり順：カード一覧 < 結果 < 指定位置カード（一覧の当選カードが結果に被らないよう一覧ごと下の層に閉じ込める） */
#stage{z-index:1}
#result{z-index:3}
.pin{z-index:4}
/* 背景色は1920×1080の枠ではなくウィンドウ全体に敷く（縦横比が違っても余白が出ないように） */
#bg{position:fixed;inset:0;transition:opacity .6s}
#bg.off{opacity:0}
#canvas.pinned #stage,#canvas.pinned #result{opacity:0}
/* 0キーで全部非表示（背景も消す） */
#canvas.hidden #stage,#canvas.hidden #result{opacity:0}
#canvas.hidden .draw-btn{pointer-events:none}
.pin{position:absolute;opacity:0;transition:opacity .6s;border-color:rgba(185,198,236,.18)}
.pin.show{opacity:1}
/* ミニカード：上の見出しの段を削って正方形にし、コンセプトだけを画像の上部に重ねる（文字の後ろは上から暗くするグラデーション） */
.cell.pinc{aspect-ratio:1/1}
.cell.pinc .art img{-webkit-mask:none;mask:none}
.cell.pinc .label{top:0;padding:calc(var(--u)*10) 4% calc(var(--u)*30);background:linear-gradient(0deg,transparent,rgba(8,7,12,.6) 40%,rgba(8,7,12,.88))}
.cell.pinc .label::after{display:none}
.cell.pinc .ttl{font-size:calc(var(--u)*22);letter-spacing:.05em}
/* 進行状況：抽選対象をミニカードと同じ正方形のカードで横一列に並べる。抽選画面ではどの画面とも別に出し、4キーで出し入れする（0キーのすべて非表示では消える） */
.clear-bar{--cw:72px;position:absolute;z-index:4;padding:calc(var(--cw)*.1);background:rgba(8,7,12,.8);border:1px solid rgba(185,198,236,.22);white-space:nowrap}
#canvas .clear-bar{transition:opacity .6s}
#canvas.clear-off .clear-bar,#canvas.hidden:not(.keep-clear) .clear-bar{opacity:0;pointer-events:none}
/* keep-clear：「結果画面のあと」の非表示。結果画面と背景だけ消して進行状況は残す */
#canvas:not(.clear-off):not(.hidden) .clear-bar .cell,#canvas.keep-clear:not(.clear-off) .clear-bar .cell{pointer-events:auto;cursor:pointer}
.cl-row{display:flex;gap:calc(var(--cw)*.08)}
.clear-bar .cell{box-shadow:0 3px 8px rgba(0,0,0,.6)}
/* 小さいので、コンセプトは字を大きめにして2行まで折り返す */
.clear-bar .cell.pinc .label{padding:calc(var(--u)*8) 3% calc(var(--u)*24)}
.clear-bar .cell.pinc .ttl{font-size:calc(var(--cw)*.18);letter-spacing:0;line-height:1.15;white-space:normal;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* 抽選で決まったキャラは光らせる。未チェックのカードは暗くしない（明るい＝残り、灰色＝済みで見分けるため） */
.clear-bar .cell.cur{border-color:var(--gold);z-index:1;box-shadow:0 0 0 4px var(--gold),0 0 14px var(--gold),0 0 28px var(--gold-soft)}
/* チェック済み：カードをしっかりグレーアウトし、右下に小さめの丸いバッジ＋チェックを付ける */
.clear-bar .cell.cleared .art{filter:grayscale(1) brightness(.35)}
.clear-bar .cell.cleared .ttl{color:#7d8190}
/* グレーアウトした上でも埋もれないよう、金で塗りつぶした丸に暗い色のチェックを抜く */
.cl-mark{display:none;position:absolute;right:5%;bottom:5%;width:32%;aspect-ratio:1/1;z-index:4;box-sizing:border-box;padding:6%;border-radius:50%;
  color:#10121c;background:var(--gold);box-shadow:0 0 3px #000}
.cl-mark svg{display:block;width:100%;height:100%}
.cell.cleared .cl-mark{display:block}

/* ---------- 設定 ---------- */
.ed-wrap{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.ed-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.ed-head h1{font-size:22px;margin:0;color:var(--accent);font-weight:700;letter-spacing:.1em}
.ed-head .ed-lead{color:var(--muted);font-size:13px}
.ed-notice{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 14px;margin:8px 0 12px;font-size:10px;line-height:1.7}
/* 言語切替（見出しの行の右端） */
.lang-switch{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;align-self:center}
.lang-btn{font:inherit;font-size:15px;padding:8px 18px;color:var(--muted);background:transparent;border:0;cursor:pointer;transition:color .2s,background .2s}
.lang-btn + .lang-btn{border-left:1px solid var(--line)}
.lang-btn:hover{color:var(--text)}
.lang-btn.on{color:#1a1408;background:var(--accent);font-weight:700;cursor:default}
/* Xへのリンク（遺物ページと同じ丸アイコン） */
.social{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  color:var(--muted);border:1px solid var(--line);transition:color .2s,border-color .2s}
.social:hover{color:var(--gold);border-color:var(--gold)}
.ed-foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.8}
.ed-foot p{margin:12px 0 0}
.foot-links{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:36px}
.foot-label{width:8em;box-sizing:border-box;text-align:center;padding:2px 8px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px}
.foot-name{color:var(--text);font-size:13.5px}
.ed-foot .social{width:30px;height:30px}
.ed-foot .social svg{width:16px;height:16px}
.ed-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.ed-cols.wide-left{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.ed-cols,.ed-cols.wide-left{grid-template-columns:1fr}}
.ed-wrap h2{font-size:16px;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--accent);font-weight:700}
.ed-note{color:var(--muted);font-size:12.5px;margin:4px 0 10px;line-height:1.7}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.chk{color:var(--muted);font-size:12.5px}
.pin-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 16px}
.opt{padding:12px 0}
.opt + .opt{border-top:1px solid var(--line)}
.opt h3{font-size:14px;margin:0 0 8px;color:var(--text);font-weight:700}
.opt .ed-note:last-child{margin-bottom:0}
.sound-cases{margin-top:10px}
.sound-cases .ed-note{margin:0 0 8px}
.case-h{display:block;color:var(--text);font-weight:700}
.bg-row{display:flex;align-items:center;gap:12px}
.bg-row input[type=color]{width:44px;height:30px;padding:0 2px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.radios{display:flex;flex-direction:column;gap:6px}
.radios input[type=radio]{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0}
.bg-controls{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bg-controls.disabled{opacity:.45;pointer-events:none}
.bg-label{min-width:5em;color:var(--muted);font-size:12.5px}
.scale-row{display:flex;align-items:center;gap:12px}
.scale-row input[type=range]{flex:1;accent-color:var(--accent)}
.scale-out{min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.pp-box{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/10% 10%,linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/10% 10%,#000 url("img/pin-preview-bg.jpg") center/cover no-repeat}
.pp-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(var(--k,.3));transform-origin:0 0}
.pp-card{position:absolute;width:var(--cw,160px);aspect-ratio:3/4;background:var(--card-bg);border:2px solid var(--gold);border-radius:calc(var(--cw,160px)*.05);
  overflow:hidden;cursor:move;touch-action:none;user-select:none;box-shadow:0 0 0 2px var(--gold),0 0 22px var(--gold-soft)}
.pp-card img{pointer-events:none}
.pp-box .clear-bar{cursor:move;touch-action:none;user-select:none}
.pin-block.disabled{opacity:.45;pointer-events:none}
.pp-handle{position:absolute;right:0;bottom:0;width:48px;height:48px;background:var(--gold);clip-path:polygon(100% 0,100% 100%,0 100%);cursor:nwse-resize;z-index:2}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=text],input[type=number],select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;min-width:0;width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
button.b{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--accent)}
button.b.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
button.b.icon{padding:6px 9px}
button.b.danger:hover{border-color:var(--danger);color:var(--danger)}
.rows{display:flex;flex-direction:column;gap:6px}
.list-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.row{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row.off{opacity:.5}
.row .ico{width:30px;height:30px;flex:none;border-radius:50%;background:var(--c,#555) center/cover no-repeat}
.row .grow{flex:1 1 120px}
.row .sel{flex:0 1 124px} /* 英語の「Undertaker」が切れない幅 */
/* スマホ幅では1行に収まらないので、コンセプト欄を1段目、キャラ選択とボタンを2段目に折り返す */
@media (max-width:520px){.row{flex-wrap:wrap}.row .grow{flex:1 1 calc(100% - 80px);min-width:0}.row .sel{flex:1 1 110px}}
.count{color:var(--muted);font-size:12.5px;margin-left:8px}
.urlbox{display:flex;gap:6px}
.urlbox input{font-family:Consolas,monospace;font-size:12px}
.usage{margin-top:28px}
.usage .urlbox input{font-family:inherit;font-size:13px}
.changelog{margin-top:28px}
.changelog dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;color:var(--muted);font-size:12.5px;line-height:1.7}
.changelog dt{font-variant-numeric:tabular-nums}
.changelog dd{margin:0}
.changelog ul{margin:0;padding-left:1.2em}
.side{position:sticky;top:12px}
.preview-top{margin-top:14px}
.howto.obs-howto{margin-top:132px}
.frame{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.howto{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 16px 12px;margin:14px 0 4px}
.howto h2{margin:8px 0 14px;padding:0;border:0;font-size:20px}
.steps{margin:0;padding-left:24px;color:var(--muted);font-size:15.5px;line-height:1.8}
.howto-note{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
.howto .keys-note{margin:-6px 0 12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;margin:0 0 4px;color:var(--muted);font-size:15px}
.keys dt{display:flex;gap:6px}
.keys dd{margin:0}
.keys-group + .keys-group{margin-top:14px}
.keys-group h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--text)}
.keys kbd{display:inline-block;min-width:2.2em;padding:2px 8px;text-align:center;font:inherit;font-size:13px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--accent);color:#1a1408;padding:8px 16px;border-radius:6px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:700}
#toast.show{opacity:1}
</style>

    if(state.noRepeat === 2){
      if(usedWinners[i]) delete usedWinners[i]; else usedWinners[i] = true;
      if(Object.keys(usedWinners).length >= cells.length) usedWinners = {}; // 全部に印が付いたら、抽選で一巡したときと同じく戻す
    }
    else if(state.noRepeat === 1) lastWinner = lastWinner === i ? -1 : i;
    // 3：クリアのチェックを付け外しする（帯のカードをクリックしたときと同じ）
    else if(state.noRepeat === 3){ toggleCleared(i); return; }
    else return;
    saveHistory();
    paintExcluded();
  }
  // 隠しコマンド：一覧でShift+クリックしたカードを、次の抽選で強制的に当てる（グレーアウト中でも当てる）。
  // 見た目は何も変えない。同じカードをもう一度Shift+クリックすると取り消し。1回の抽選で使い切る
  var forced = -1;
  function toggleForced(i){
    if(running || stage.classList.contains('done') || canvas.classList.contains('pinned') || canvas.classList.contains('hidden')) return;
    forced = forced === i ? -1 : i;
  }
  cells.forEach(function(c, i){ c.addEventListener('click', function(ev){ if(ev.shiftKey) toggleForced(i); else toggleUsed(i); }); });
  if(state.noRepeat) grid.classList.add('toggleable');
  // 次の抽選で当たらないカードをグレーアウトする
  function paintExcluded(){
    var cand = candidates(cells.length);
    cells.forEach(function(c, i){ c.classList.toggle('out', cand.indexOf(i) < 0); });
  }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  // 効果音（効果音ラボ）。抽選中は心臓の鼓動、決定して結果画面に切り替わるときに「シーン切り替え2」
  // OBSで<audio>を鳴らすと途切れてブチブチ鳴ることがあるので、Web Audioで開いた時点に全部デコードしておき、メモリから鳴らす
  var AC = window.AudioContext || window.webkitAudioContext;
  // 抽選の演出中に音が途切れないよう、出力バッファを大きめに取る（playback）。OBSに合わせて48kHzで鳴らす
  var actx = null, gain = null, seBuf = {}, seSrc = {};
  if(SOUND_ENABLED && state.sound.on && AC){
    try{ actx = new AC({latencyHint:'playback', sampleRate:48000}); }catch(e){ actx = new AC(); }
  }
  if(actx){
    gain = actx.createGain();
    gain.gain.value = state.sound.vol / 100;
    gain.connect(actx.destination);
    // 鳴っていない間も無音を流し続け、OBSへの音声の受け渡しが鳴り始め・止めたときに開き直されないようにする
    var keep = actx.createBufferSource();
    keep.buffer = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    keep.loop = true;
    keep.connect(actx.destination);
    keep.start();
    [['beat', 'se/heartbeat.mp3'], ['decide', 'se/decide.mp3']].forEach(function(s){
      fetch(s[1]).then(function(r){ return r.arrayBuffer(); })
        .then(function(ab){ actx.decodeAudioData(ab, function(buf){ seBuf[s[0]] = buf; }, function(){}); })
        .catch(function(){});
    });
  }
  function playSe(k){
    if(!actx || !seBuf[k]) return;
    // ユーザー操作なしの自動抽選では、ブラウザが再開を許さず鳴らないことがある
    if(actx.state === 'suspended') actx.resume().catch(function(){});
    stopSe(k);
    // 鳴り始めと止めるときに波形が急に切れるとプツッと鳴るので、音ごとのGainで短くフェードする
    var src = actx.createBufferSource(), g = actx.createGain(), t = actx.currentTime;
    src.buffer = seBuf[k];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.01);
    src.connect(g);
    g.connect(gain);
    src.start(t);
    seSrc[k] = {src:src, g:g};
  }
  // kを省略するとすべて止める
  function stopSe(k){
    (k ? [k] : Object.keys(seSrc)).forEach(function(n){
      var s = seSrc[n];
      if(!s) return;
      var t = actx.currentTime;
      s.g.gain.cancelScheduledValues(t);
      s.g.gain.setValueAtTime(s.g.gain.value, t);
      s.g.gain.linearRampToValueAtTime(0, t + 0.04);
      try{ s.src.stop(t + 0.05); }catch(e){}
      seSrc[n] = null;
    });
  }
  // ミニカードを消す（0キーの全部非表示も解除して、背景を戻す）
  function unpin(){
    clearTimeout(pinTimer); pinTimer = null;
    canvas.classList.remove('pinned', 'hidden', 'keep-clear');
    if(bgEl) bgEl.classList.remove('off');
    if(pinEl){ pinEl.remove(); pinEl = null; }
  }
  // 抽選前の状態に戻す（途中の演出も止める）。アニメーションなしで即座に切り替える
  function reset(){
    timers.forEach(clearTimeout); timers = [];
    stopSe();
    running = false; lastDrawAt = 0;
    stage.classList.remove('running');
    document.body.classList.add('instant');
    unpin();
    stage.classList.remove('done'); resultEl.classList.remove('show');
    cells.forEach(function(c){ c.classList.remove('win', 'on'); });
    paintExcluded();
    resultEl.innerHTML = '';
    void document.body.offsetHeight;
    document.body.classList.remove('instant');
  }
  // 当選カードだけを指定位置に出す（結果画面はフェードアウト）
  function pinWinner(i){
    var p = state.pin;
    pinEl = cells[i].cloneNode(true);
    pinEl.className = 'cell pin';
    toPinCell(pinEl, pool[i]);
    pinEl.style.setProperty('--cw', Math.max(20, p.w) + 'px');
    pinEl.style.left = p.x + 'px';
    pinEl.style.top = pinTop(pool[i], p) + 'px';
    canvas.appendChild(pinEl);
    canvas.classList.add('pinned');
    if(bgEl) bgEl.classList.add('off');
    void pinEl.offsetHeight;
    pinEl.classList.add('show');
  }
  function draw(){
    var now = Date.now();
    if(running || !cells.length || now - lastDrawAt < 800) return;
    running = true; lastDrawAt = now;
    stopSe(); playSe('beat');
    stage.classList.add('running');
    unpin();
    stage.classList.remove('done'); resultEl.classList.remove('show');
    cells.forEach(function(c){ c.classList.remove('win', 'on'); });
    paintExcluded();

    // 光はグレーアウトしていないカードの上だけを走る
    var cand = candidates(cells.length), n = cand.length;
    var winner = forced >= 0 ? forced : cand[Math.floor(Math.random()*n)];
    forced = -1;
    function randCand(){ return cand[Math.floor(Math.random()*n)]; }
    var dur = DURATION_MS;
    // 最初は速く、終盤にかけて減速。同じマスに連続で止まらない
    var seq = [], t = 0, cur = -1;
    while(t < dur){
      var p = t/dur, next;
      do { next = randCand(); } while(n > 1 && next === cur);
      seq.push([t, next]); cur = next;
      t += 45 + 430*Math.pow(p, 2.4);
    }
    if(n > 1 && cur === winner){ do { seq[seq.length-1][1] = randCand(); } while(seq[seq.length-1][1] === winner); }
    seq.push([t + 120, winner]);

    var prev = null;
    seq.forEach(function(s, i){
      later(function(){
        if(prev) prev.classList.remove('on');
        prev = cells[s[1]]; prev.classList.add('on');
        if(i === seq.length-1) later(function(){ finish(winner); }, 500);
      }, s[0]);
    });
  }
  function finish(i){
    recordWinner(i);
    lastWin = i;
    paintClear();
    playSe('decide');
    running = false;
    stage.classList.remove('running');
    showResult(i, true);
  }
  // 結果画面を出す。auto=false（2キー）のときはミニカードへ自動で切り替えず、「もう一度」も出す
  function showResult(i, auto){
    unpin();
    cells.forEach(function(c){ c.classList.remove('win', 'on'); });
    cells[i].classList.add('win');
    stage.classList.add('done');
    // ミニカードから戻ったときも拡大の演出が出るよう、一度消してから出し直す
    resultEl.classList.remove('show');
    void resultEl.offsetHeight;
    // 当選カードを複製して中央に大きく出す
    var big = cells[i].cloneNode(true);
    // 一覧に戻した後に2キーで出すと、連続を避ける設定で当選カードがグレーアウトしていることがある
    big.classList.remove('win', 'on', 'out');
    big.style.setProperty('--cw', Math.floor(Math.min(CANVAS_H * 0.5 * 0.75, CANVAS_W * 0.3)) + 'px');
    rName.innerHTML = '';
    if(pool[i].concept) rName.appendChild(el('span', {className:'r-concept', text:pool[i].concept}));
    rName.appendChild(document.createTextNode(charName(charOf(pool[i]))));
    resultEl.innerHTML = '';
    resultEl.appendChild(big);
    resultEl.appendChild(el('div', {className:'r-text'}, [el('div', {className:'r-label', text:t('next')}), rName]));
    // 5秒後に切り替える設定なら、結果画面はすぐ消えて押せないので「もう一度」は出さない
    var againBtn = auto && (state.pin.on || state.hideAfter) ? null : drawButton(t('again'));
    if(againBtn) resultEl.appendChild(el('div', {className:'r-btns'}, [againBtn,
      el('button', {className:'back-link', text:t('back'), onclick:function(){ this.blur(); reset(); }})]));
    resultEl.classList.add('show');
    if(auto && state.pin.on) pinTimer = setTimeout(function(){ pinWinner(i); }, PIN_DELAY_MS);
    // 非表示にするときは、結果画面と背景をフェードアウトさせる（進行状況は残す）。ほかのキーやボタンで戻せる
    else if(auto && state.hideAfter) pinTimer = setTimeout(function(){
      pinTimer = null;
      canvas.classList.add('hidden', 'keep-clear');
      if(bgEl) bgEl.classList.add('off');
    }, PIN_DELAY_MS);
  }
  // 3キーでミニカードを出す。自動切り替えがOFFでも、設定した位置（無ければ初期位置）に出す
  function showMini(i){
    canvas.classList.remove('hidden', 'keep-clear');
    if(pinEl) return;
    clearTimeout(pinTimer); pinTimer = null;
    pinWinner(i);
  }
  // 0キーで全部（背景も）非表示にする。抽選前の状態に戻してから消すので、ほかのキーやボタンで戻せる
  // ミニカードから消したときに一覧や背景が一瞬戻って見えないよう、Escと同じく即座に切り替える
  function hideAll(){
    reset();
    document.body.classList.add('instant');
    canvas.classList.add('hidden');
    if(bgEl) bgEl.classList.add('off');
    void document.body.offsetHeight;
    document.body.classList.remove('instant');
  }
  // 0〜3キーでの画面切り替え。結果画面とミニカードは直前の抽選結果を出す（抽選中・まだ抽選していないときは何もしない）
  function switchScreen(n){
    if(n === 0){ hideAll(); return; }
    if(n === 1){ reset(); return; }
    if(running || lastWin < 0) return;
    if(n === 2) showResult(lastWin, false);
    else showMini(lastWin);
  }

  document.addEventListener('keydown', function(ev){
    // OBSの「対話」から送られるキー入力は ev.code が空のことがあるので、key / keyCode でも判定する
    if(ev.code === 'Space' || ev.code === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar' || ev.key === 'Enter' || ev.keyCode === 32 || ev.keyCode === 13){ ev.preventDefault(); draw(); }
    // Escで抽選前の一覧に戻す（抽選中なら取り消し、ミニカードも消す）
    else if(ev.code === 'Escape' || ev.key === 'Escape' || ev.key === 'Esc' || ev.keyCode === 27){ ev.preventDefault(); reset(); }
    // 0＝全部非表示、1＝抽選前の一覧、2＝結果画面、3＝ミニカード（テンキーも可）
    else if(!ev.ctrlKey && !ev.metaKey && !ev.altKey && /^[0-3]$/.test(ev.key || '')){ ev.preventDefault(); switchScreen(Number(ev.key)); }
    // keyCodeはShift+数字（!や"）でも同じ値になるので、ev.keyが取れないときだけ使う
    else if(!ev.ctrlKey && !ev.metaKey && !ev.altKey && (!ev.key || ev.key === 'Unidentified') && ((ev.keyCode >= 48 && ev.keyCode <= 51) || (ev.keyCode >= 96 && ev.keyCode <= 99))){ ev.preventDefault(); switchScreen(ev.keyCode % 48); }
    // Ctrl+R（再読み込み）などは邪魔しない
    else if(!ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.code === 'KeyR' || ev.key === 'r' || ev.key === 'R' || ev.keyCode === 82)){ ev.preventDefault(); clearHistory(); }
    // Cで直前に決まったキャラのクリアのチェックを付け外し（Ctrl+Cのコピーは邪魔しない）
    else if(!ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.code === 'KeyC' || ev.key === 'c' || ev.key === 'C' || ev.keyCode === 67)){ ev.preventDefault(); if(!running) toggleCleared(lastWin); }
    // 4で進行状況の表示／非表示（テンキーも可。ev.keyが取れないときだけkeyCodeを見る）
    else if(!ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.key === '4' || ((!ev.key || ev.key === 'Unidentified') && (ev.keyCode === 52 || ev.keyCode === 100)))){ ev.preventDefault(); toggleClearBar(); }
  });
  // キーに不慣れな人向けに、画面のダブルクリックでも一覧に戻す（抽選中・ボタンと進行状況の帯の上は除く。押し間違いで抽選を取り消さないため）
  document.addEventListener('dblclick', function(ev){
    if(running || (ev.target.closest && ev.target.closest('button, .clear-bar'))) return;
    reset();
  });
  // OBSで非表示になったら抽選前の状態に戻し、表示されたら（自動抽選ONなら）抽選する。
  // 目のアイコンでの表示切替（Visible）とシーン切替（Active）の両方を拾う
  function onObsShow(shown){
    reset();
    if(shown && state.autoStart) later(draw, 400);
  }
  window.addEventListener('obsSourceActiveChanged', function(ev){ if(ev.detail) onObsShow(ev.detail.active); });
  window.addEventListener('obsSourceVisibleChanged', function(ev){ if(ev.detail) onObsShow(ev.detail.visible); });
  paintExcluded();
  paintClear();
  if(state.autoStart) later(draw, 700);
}

// ================= 設定モード =================
function startEditor(){
  document.body.classList.add('edit');
  var app = document.getElementById('app');
  var obsInput = el('input', {type:'text', readOnly:true});
  var frame = el('iframe', {title:t('preview')});
  var countEl = el('span', {className:'count'});
  var listBox = el('div', {className:'rows'});
  var frameTimer;

  function sync(reloadPreview){
    history.replaceState(null, '', editUrl(state));
    obsInput.value = displayUrl(state);
    countEl.textContent = t('count', state.entries.length, MAX_ENTRIES);
    refreshPinCard();
    refreshClear();
    if(reloadPreview !== false){
      clearTimeout(frameTimer);
      frameTimer = setTimeout(function(){ frame.src = displayUrl(state); }, 500);
    }
  }
  function copy(input, msg){
    (navigator.clipboard ? navigator.clipboard.writeText(input.value) : Promise.reject())
      .then(function(){ toast(msg); })
      .catch(function(){ input.select(); document.execCommand('copy'); toast(msg); });
  }

  function buildList(){
    listBox.innerHTML = '';
    state.entries.forEach(function(e, idx){
      var row = el('div', {className:'row' + (e.enabled ? '' : ' off')});
      var ico = el('div', {className:'ico'});
      function paintIco(){ var c = charOf(e); ico.style.setProperty('--c', c.color); ico.style.backgroundImage = c.img ? 'url("' + c.img + '")' : ''; }
      paintIco();
      var sel = el('select', {className:'sel', onchange:function(){ e.charId = this.value; paintIco(); sync(); }});
      CHARS.forEach(function(c){ sel.appendChild(el('option', {value:c.id, text:charName(c), selected:c.id === e.charId})); });
      [
        el('input', {type:'checkbox', checked:e.enabled, title:t('enable'), onchange:function(){ e.enabled = this.checked; row.classList.toggle('off', !e.enabled); sync(); }}),
        ico,
        el('input', {type:'text', className:'grow', value:e.concept, maxLength:16, placeholder:t(idx === 0 ? 'conceptPh' : 'conceptPhShort'), oninput:function(){ e.concept = this.value; sync(); }}),
        sel,
        el('button', {className:'b icon', text:'↑', title:t('up'), onclick:function(){ move(idx, -1); }}),
        el('button', {className:'b icon', text:'↓', title:t('down'), onclick:function(){ move(idx, 1); }}),
        el('button', {className:'b icon', text:t('dup'), onclick:function(){
          if(state.entries.length >= MAX_ENTRIES){ toast(t('maxToast', MAX_ENTRIES)); return; }
          state.entries.splice(idx+1, 0, {concept:e.concept, charId:e.charId, enabled:e.enabled}); buildList(); sync();
        }}),
        el('button', {className:'b icon danger', text:t('del'), onclick:function(){ state.entries.splice(idx, 1); buildList(); sync(); }})
      ].forEach(function(k){ row.appendChild(k); });
      listBox.appendChild(row);
    });
  }
  function setAll(on){
    state.entries.forEach(function(e){ e.enabled = on; }); buildList(); sync();
  }
  function move(i, d){
    var j = i + d; if(j < 0 || j >= state.entries.length) return;
    var t = state.entries[i]; state.entries[i] = state.entries[j]; state.entries[j] = t; buildList(); sync();
  }

  // ---- ミニカード位置：数値入力＋ドラッグで動かせる位置調整プレビュー ----
  var PIN_LIMIT = {x:[0, CANVAS_W], y:[0, CANVAS_H], w:[20, CANVAS_W]};
  var pinInputs = {};
  function pinField(label, key){
    pinInputs[key] = el('input', {type:'number', min:PIN_LIMIT[key][0], max:PIN_LIMIT[key][1], step:1, value:state.pin[key], oninput:function(){
      var v = Math.round(Number(this.value));
      if(this.value === '' || isNaN(v)) return;
      state.pin[key] = Math.min(PIN_LIMIT[key][1], Math.max(PIN_LIMIT[key][0], v)); paintPin(); sync();
    }});
    return el('div', {className:'field'}, [el('label', {text:label}), pinInputs[key]]);
  }
  var pinCard = el('div', {className:'cell pp-card'}), pinCardKey = '';
  var pinHandle = el('div', {className:'pp-handle', title:t('resize')});
  var pinStage = el('div', {className:'pp-stage'}, [pinCard]);
  var pinBox = el('div', {className:'pp-box'}, [pinStage]);
  function sampleEntry(){
    for(var i=0;i<state.entries.length;i++){ if(state.entries[i].enabled) return state.entries[i]; }
    return state.entries[0] || {concept:'', charId:CHARS[0].id};
  }
  // 見本カードは抽選対象の先頭エントリー。中身が変わったときだけ作り直す
  function refreshPinCard(){
    var e = sampleEntry(), key = e.concept + '\n' + e.charId;
    if(key === pinCardKey) return;
    pinCardKey = key;
    pinCard.innerHTML = '';
    // コンセプトが空でも見え方が分かるよう、見本には例のコンセプトを入れる
    if(!e.concept) e = {concept:t('sampleConcept'), charId:e.charId};
    var cell = makeCell(e);
    toPinCell(cell, e);
    pinCard.classList.add('pinc');
    while(cell.firstChild) pinCard.appendChild(cell.firstChild);
    pinCard.style.setProperty('--c', cell.style.getPropertyValue('--c'));
    pinCard.appendChild(pinHandle);
    paintPin(); // コンセプトの有無で高さが変わるので位置も塗り直す
  }
  function paintPin(){
    pinCard.style.left = state.pin.x + 'px';
    pinCard.style.top = pinTop(sampleEntry(), state.pin) + 'px';
    pinCard.style.setProperty('--cw', state.pin.w + 'px');
  }
  function fitPin(){ pinStage.style.setProperty('--k', pinBox.clientWidth / CANVAS_W); }
  function setPin(x, y, w){
    // ドラッグでは画面の外にはみ出さないようにする
    w = Math.min(PIN_LIMIT.w[1], Math.max(PIN_LIMIT.w[0], w), CANVAS_H * 0.75);
    state.pin.w = Math.round(w);
    state.pin.x = Math.round(Math.min(CANVAS_W - w, Math.max(0, x)));
    state.pin.y = Math.round(Math.min(CANVAS_H - w / 0.75, Math.max(0, y)));
    ['x', 'y', 'w'].forEach(function(k){ pinInputs[k].value = state.pin[k]; });
    paintPin(); sync();
  }
  // カード本体のドラッグで移動、右下のつまみで幅を変える
  pinCard.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    var k = pinBox.clientWidth / CANVAS_W, sx = ev.clientX, sy = ev.clientY;
    var start = {x:state.pin.x, y:state.pin.y, w:state.pin.w}, resize = ev.target === pinHandle;
    pinCard.setPointerCapture(ev.pointerId);
    function onMove(m){
      var dx = (m.clientX - sx) / k, dy = (m.clientY - sy) / k;
      if(resize) setPin(start.x, start.y, start.w + Math.max(dx, dy * 0.75));
      else setPin(start.x + dx, start.y + dy, start.w);
    }
    function onUp(){ pinCard.removeEventListener('pointermove', onMove); pinCard.removeEventListener('pointerup', onUp); pinCard.removeEventListener('pointercancel', onUp); }
    pinCard.addEventListener('pointermove', onMove);
    pinCard.addEventListener('pointerup', onUp);
    pinCard.addEventListener('pointercancel', onUp);
  });
  // 位置は3キーでも使うので、自動切り替えのON/OFFに関係なく編集できる
  var pinFields = el('div', {className:'pin-block'}, [
    el('div', {className:'pin-fields'}, [
      pinField(t('pinX'), 'x'),
      pinField(t('pinY'), 'y'),
      pinField(t('pinW'), 'w')
    ]),
    pinBox,
    el('p', {className:'ed-note', text:t('pinBoxNote')})
  ]);
  refreshPinCard(); paintPin();
  if(window.ResizeObserver) new ResizeObserver(fitPin).observe(pinBox);
  else window.addEventListener('resize', fitPin);

  // ---- 進行状況：数値入力＋ドラッグで動かせる位置調整プレビュー ----
  var CLEAR_LIMIT = {x:[0, CANVAS_W], y:[0, CANVAS_H], w:[30, 160]};
  var clearInputs = {};
  function clearField(label, key){
    clearInputs[key] = el('input', {type:'number', min:CLEAR_LIMIT[key][0], max:CLEAR_LIMIT[key][1], step:1, value:state.clear[key], oninput:function(){
      var v = Math.round(Number(this.value));
      if(this.value === '' || isNaN(v)) return;
      state.clear[key] = Math.min(CLEAR_LIMIT[key][1], Math.max(CLEAR_LIMIT[key][0], v)); sync();
    }});
    return el('div', {className:'field'}, [el('label', {text:label}), clearInputs[key]]);
  }
  var clearStage = el('div', {className:'pp-stage'});
  var clearBox = el('div', {className:'pp-box'}, [clearStage]);
  var clearWarn = el('p', {className:'ed-note', text:t('clearMaxNote', CLEAR_MAX)}); // 常に出し、超えているときだけ赤くする
  var clearChk = el('input', {type:'checkbox', checked:state.clear.on, onchange:function(){ state.clear.on = this.checked; sync(); }});
  var clearPv = null, clearKey = '';
  function clearEntries(){ return state.entries.filter(function(e){ return e.enabled; }); }
  // 帯は抽選対象（先頭からCLEAR_MAX件）で作り、中身か幅が変わったときだけ作り直す（ドラッグ中に作り直すと掴んだ要素が消えるため）
  function refreshClear(){
    var es = clearEntries(), over = es.length > CLEAR_MAX;
    clearWarn.style.color = over ? 'var(--danger)' : '';
    clearFields.classList.toggle('disabled', !state.clear.on || over);
    var shown = (es.length ? es : state.entries).slice(0, CLEAR_MAX);
    var key = JSON.stringify(shown.map(function(e){ return [e.concept, e.charId]; })) + state.clear.w;
    if(key !== clearKey){
      clearKey = key;
      if(clearPv) clearPv.el.remove();
      clearPv = makeClearBar(shown, state.clear);
      // 見え方が分かるよう、先頭2枚をクリア済み、3枚目を抽選で決まったカードにしておく
      paintClearBar(clearPv, {0:true, 1:true}, Math.min(2, shown.length - 1));
      clearPv.el.addEventListener('pointerdown', dragClear);
      clearStage.appendChild(clearPv.el);
    }
    clearPv.el.style.left = state.clear.x + 'px';
    clearPv.el.style.top = state.clear.y + 'px';
  }
  function dragClear(ev){
    ev.preventDefault();
    var bar = clearPv.el, k = clearBox.clientWidth / CANVAS_W, sx = ev.clientX, sy = ev.clientY;
    var start = {x:state.clear.x, y:state.clear.y};
    bar.setPointerCapture(ev.pointerId);
    function onMove(m){
      // 画面の外にはみ出さないようにする
      state.clear.x = Math.round(Math.min(CANVAS_W - bar.offsetWidth, Math.max(0, start.x + (m.clientX - sx) / k)));
      state.clear.y = Math.round(Math.min(CANVAS_H - bar.offsetHeight, Math.max(0, start.y + (m.clientY - sy) / k)));
      clearInputs.x.value = state.clear.x; clearInputs.y.value = state.clear.y;
      sync();
    }
    function onUp(){ bar.removeEventListener('pointermove', onMove); bar.removeEventListener('pointerup', onUp); bar.removeEventListener('pointercancel', onUp); }
    bar.addEventListener('pointermove', onMove);
    bar.addEventListener('pointerup', onUp);
    bar.addEventListener('pointercancel', onUp);
  }
  var clearFields = el('div', {className:'pin-block'}, [
    el('div', {className:'pin-fields'}, [
      clearField(t('pinX'), 'x'),
      clearField(t('pinY'), 'y'),
      clearField(t('clearW'), 'w')
    ]),
    clearBox,
    el('p', {className:'ed-note', text:t('clearBoxNote')})
  ]);
  function fitClear(){ clearStage.style.setProperty('--k', clearBox.clientWidth / CANVAS_W); }
  if(window.ResizeObserver) new ResizeObserver(fitClear).observe(clearBox);
  else window.addEventListener('resize', fitClear);

  var scaleOut = el('span', {className:'scale-out', text:state.scale + '%'});
  var bgPicker = el('input', {type:'color', value:state.bg.color, oninput:function(){ state.bg.color = this.value; sync(); }});
  var bgAlphaOut = el('span', {className:'scale-out', text:state.bg.alpha + '%'});
  var bgAlpha = el('input', {type:'range', min:0, max:100, step:5, value:state.bg.alpha, oninput:function(){
    state.bg.alpha = Number(this.value); bgAlphaOut.textContent = state.bg.alpha + '%'; sync();
  }});
  var volOut = el('span', {className:'scale-out', text:state.sound.vol + '%'});
  var volControls = el('div', {className:'bg-controls' + (state.sound.on ? '' : ' disabled')}, [
    el('div', {className:'scale-row'}, [el('span', {className:'bg-label', text:t('volume')}),
      el('input', {type:'range', min:5, max:100, step:5, value:state.sound.vol, oninput:function(){
        state.sound.vol = Number(this.value); volOut.textContent = state.sound.vol + '%'; sync();
      }}), volOut])
  ]);
  var bgControls = el('div', {className:'bg-controls' + (state.bg.on ? '' : ' disabled')}, [
    el('div', {className:'bg-row'}, [el('span', {className:'bg-label', text:t('color')}), bgPicker]),
    el('div', {className:'scale-row'}, [el('span', {className:'bg-label', text:t('alpha')}), bgAlpha, bgAlphaOut])
  ]);
  // 上段（共通）：エントリー｜連続回避・あとで編集　下段（OBS用）：オプション｜URL
  var left = el('div', {}, [
    el('h2', {}, [t('entriesH'), countEl]),
    el('p', {className:'ed-note', text:t('entriesNote')}),
    el('div', {className:'list-tools'}, [
      el('button', {className:'b', text:t('allOn'), onclick:function(){ setAll(true); }}),
      el('button', {className:'b', text:t('allOff'), onclick:function(){ setAll(false); }})
    ]),
    listBox,
    el('p', {}, [el('button', {className:'b', text:t('add'), onclick:function(){
      if(state.entries.length >= MAX_ENTRIES){ toast(t('maxToast', MAX_ENTRIES)); return; }
      state.entries.push({concept:'', charId:CHARS[0].id, enabled:true}); buildList(); sync();
    }})])
  ]);

  var right = el('div', {className:'side'}, [
    el('h2', {text:t('noRepH')}),
    el('div', {className:'opts'}, [
      el('div', {className:'opt'}, [
        el('div', {className:'radios'}, [
          [t('noRep0'), 0], [t('noRep1'), 1], [t('noRep2'), 2], [t('noRep3'), 3]
        ].map(function(r){
          return el('label', {className:'chk'}, [el('input', {type:'radio', name:'noRepeat', checked:state.noRepeat === r[1], onchange:function(){ state.noRepeat = r[1]; sync(); }}), r[0]]);
        })),
        el('p', {className:'ed-note', style:'margin-top:12px', text:t('noRepNote')})
      ]),
      // ブラウザで使う人向け。消えるのはこのブラウザに保存した今の設定の履歴だけ（OBSのブラウザは保存先が別）
      el('div', {className:'opt'}, [
        el('h3', {text:t('histResetH')}),
        el('p', {className:'ed-note', text:t('histResetNote')}),
        el('button', {className:'b', text:t('histReset'), onclick:function(){
          try{
            var all = JSON.parse(localStorage.getItem(HIST_KEY)) || {};
            delete all[encode(state)];
            localStorage.setItem(HIST_KEY, JSON.stringify(all));
          }catch(e){}
          frame.src = displayUrl(state);
          toast(t('histCleared'));
        }})
      ])
    ]),
    el('h2', {text:t('saveH')}),
    el('p', {className:'ed-note', text:t('saveNote')}),
    // 今の設定を失わないよう、初期設定のページは新しいタブで開く（言語は今のまま）
    el('button', {className:'b', style:'margin-top:8px', text:t('openDefault'), onclick:function(){ window.open(baseUrl() + '?lang=' + LANG, '_blank'); }})
  ]);

  var obsLeft = el('div', {}, [
    el('h2', {text:t('optH')}),
    el('div', {className:'opts'}, [
      el('div', {className:'opt'}, [
        el('h3', {text:t('scaleH')}),
        el('div', {className:'scale-row'}, [
          el('input', {type:'range', min:SCALE_MIN, max:SCALE_MAX, step:5, value:state.scale, oninput:function(){
            state.scale = Number(this.value); scaleOut.textContent = state.scale + '%'; sync();
          }}),
          scaleOut
        ]),
        el('p', {className:'ed-note', text:t('scaleNote')})
      ]),
      el('div', {className:'opt'}, [
        el('h3', {text:t('bgH')}),
        el('label', {className:'chk'}, [el('input', {type:'checkbox', checked:state.bg.on, onchange:function(){ state.bg.on = this.checked; bgControls.classList.toggle('disabled', !state.bg.on); sync(); }}), t('bgChk')]),
        bgControls,
        el('p', {className:'ed-note', text:t('bgNote')})
      ]),
      // ミニカードへの切り替えと非表示は同時に使えないので、1つを選ぶ
      el('div', {className:'opt'}, [
        el('h3', {text:t('afterH')}),
        el('div', {className:'radios'}, [
          [t('after0'), 0], [t('after1'), 1], [t('after2'), 2]
        ].map(function(r){
          var cur = state.pin.on ? 1 : state.hideAfter ? 2 : 0;
          return el('label', {className:'chk'}, [el('input', {type:'radio', name:'after', checked:cur === r[1], onchange:function(){
            state.pin.on = r[1] === 1; state.hideAfter = r[1] === 2; sync();
          }}), r[0]]);
        })),
        el('p', {className:'ed-note', style:'margin-top:12px', text:t('afterNote')})
      ]),
      el('div', {className:'opt'}, [
        el('h3', {text:t('btnH')}),
        el('label', {className:'chk'}, [el('input', {type:'checkbox', checked:state.button, onchange:function(){ state.button = this.checked; sync(); }}), t('btnChk')]),
        el('p', {className:'ed-note', text:t('btnNote')})
      ]),
      el('div', {className:'opt'}, [
        el('h3', {text:t('autoH')}),
        el('label', {className:'chk'}, [el('input', {type:'checkbox', checked:state.autoStart, onchange:function(){ state.autoStart = this.checked; sync(); }}), t('autoChk')]),
        el('p', {className:'ed-note', text:t('autoNote')})
      ]),
      !SOUND_ENABLED ? null : el('div', {className:'opt'}, [
        el('h3', {text:t('soundH')}),
        el('label', {className:'chk'}, [el('input', {type:'checkbox', checked:state.sound.on, onchange:function(){ state.sound.on = this.checked; volControls.classList.toggle('disabled', !state.sound.on); sync(); }}), t('soundChk')]),
        volControls,
        // OBSでの音の出し方。デスクトップ音声を使っているかどうかで手順が変わる
        el('div', {className:'sound-cases'}, [
          el('p', {className:'ed-note'}, [el('span', {className:'case-h', text:t('soundCase1H')}), t('soundCase1')]),
          el('p', {className:'ed-note'}, [el('span', {className:'case-h', text:t('soundCase2H')}), t('soundCase2')])
        ])
      ]),
      // 位置調整のプレビューが大きいので、ミニカードと進行状況は最後に置く
      el('div', {className:'opt'}, [
        el('h3', {text:t('pinH')}),
        el('p', {className:'ed-note', text:t('pinNote')}),
        pinFields
      ]),
      el('div', {className:'opt'}, [
        el('h3', {text:t('clearH', CLEAR_MAX)}),
        clearWarn,
        el('label', {className:'chk'}, [clearChk, t('clearChk')]),
        el('p', {className:'ed-note', text:t('clearNote')}),
        clearFields
      ])
    ])
  ]);

  var xLink = el('a', {className:'social', href:'https://x.com/u_se_nr', target:'_blank', rel:'noopener noreferrer', title:'X'});
  xLink.setAttribute('aria-label', 'X');
  xLink.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

  var ytLink = el('a', {className:'social', href:'https://www.youtube.com/@%E3%81%88%E3%81%99%E3%81%95%E3%82%93-0', target:'_blank', rel:'noopener noreferrer', title:'YouTube'});
  ytLink.setAttribute('aria-label', 'YouTube');
  ytLink.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3.02 3.02 0 0 0-2.13-2.14C19.51 3.5 12 3.5 12 3.5s-7.51 0-9.37.56A3.02 3.02 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.13 2.14C4.49 20.5 12 20.5 12 20.5s7.51 0 9.37-.56a3.02 3.02 0 0 0 2.13-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.4 3.6z"/></svg>';

  // プレビューはページ上部に1カラムで置く
  var preview = el('div', {className:'preview-top'}, [
    el('div', {className:'frame'}, [frame])
  ]);

  var obsRight = el('div', {className:'side'}, [
    el('h2', {text:t('urlH')}),
    el('div', {className:'urlbox'}, [obsInput,
      el('button', {className:'b primary', text:t('copy'), onclick:function(){ copy(obsInput, t('copied')); }})]),
    el('p', {className:'howto-note', text:t('urlNote')})
  ]);

  // 概要欄に貼ってもらう用の紹介文。ローカル確認時もURLは公開先にする
  var creditInput = el('input', {type:'text', readOnly:true,
    value:t('creditText') + ' ' + PUBLIC_URL + (LANG === 'en' ? '?lang=en' : '')});
  var usage = el('div', {className:'usage'}, [
    el('h2', {text:t('usageH')}),
    el('p', {className:'ed-note', text:t('usageNote')}),
    el('p', {className:'ed-note', text:t('creditNote')}),
    el('div', {className:'urlbox'}, [creditInput,
      el('button', {className:'b primary', text:t('copy'), onclick:function(){ copy(creditInput, t('copiedCredit')); }})])
  ]);

  var changelog = el('div', {className:'changelog'}, [
    el('h2', {text:t('logH')}),
    el('dl', {}, CHANGELOG.reduce(function(a, c){
      a.push(el('dt', {text:c.date}));
      a.push(el('dd', {}, [el('ul', {}, (c[LANG] || c.ja).map(function(s){ return el('li', {text:s}); }))]));
      return a;
    }, []))
  ]);

  // 言語切替。設定はすべてURLに入っているので、言語を変えたURLで開き直すだけでよい
  var langSwitch = el('div', {className:'lang-switch', role:'group'}, [['ja', '日本語'], ['en', 'English']].map(function(l){
    var b = el('button', {type:'button', className:'lang-btn' + (LANG === l[0] ? ' on' : ''), text:l[1], onclick:function(){
      if(LANG === l[0]) return;
      state.lang = l[0];
      location.replace(editUrl(state));
    }});
    b.setAttribute('aria-pressed', LANG === l[0] ? 'true' : 'false');
    b.setAttribute('lang', l[0]);
    return b;
  }));
  langSwitch.setAttribute('aria-label', 'Language');

  app.appendChild(el('div', {className:'ed-wrap'}, [
    el('div', {className:'ed-head'}, [el('h1', {text:t('heading')}), el('span', {className:'ed-lead', text:t('lead')}), langSwitch]),
    // 2026年10月のPHP脆弱性騒ぎへの案内。落ち着いたら消す
    el('p', {className:'ed-notice', text:t('notice')}),
    preview,
    el('div', {className:'ed-cols wide-left'}, [left, right]),
    el('div', {className:'howto obs-howto'}, [
      el('h2', {text:t('howtoH')}),
      el('ol', {className:'steps'}, [
        el('li', {text:t('step1')}),
        el('li', {text:t('step2')}),
        el('li', {text:t('step3')})
      ]),
      el('p', {className:'howto-note', text:t('howtoNote')})
    ]),
    el('div', {className:'howto'}, [
      el('h2', {text:t('keysH')}),
      el('p', {className:'howto-note keys-note', text:t('keysNote')}),
      keyList('keysOpH', [[['Space'], 'keyDraw'], [['Enter'], 'keyDraw'], [['R'], 'keyReset'], [['C'], 'keyClear'], [[t('clickLbl')], 'keyToggle'], [[t('barClickLbl')], 'keyBarClick'], [[t('barRclickLbl')], 'keyBarRclick']]),
      keyList('keysScrH', [[['Esc'], 'keyBack'], [['1'], 'keyBack'], [[t('dblLbl')], 'keyDbl'], [['2'], 'keyResult'], [['3'], 'keyMini'], [['4'], 'keyClearBar'], [['0'], 'keyHide']])
    ]),
    el('div', {className:'ed-cols'}, [obsLeft, obsRight]),
    usage,
    changelog,
    el('div', {className:'ed-foot'}, [
      el('div', {className:'foot-links'}, [
        el('span', {className:'foot-label', text:t('author')}),
        el('span', {className:'foot-name', text:t('authorName')}),
        xLink, ytLink
      ]),
      el('p', {text:t('disclaimer')})
    ])
  ]));
  buildList();
  sync();
}
})();
</script>
</body>
</html>
